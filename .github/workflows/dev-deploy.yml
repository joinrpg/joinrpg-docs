name: Build and deploy dev docs

on:
  push:
    branches-ignore:
      - "master"
    tags-ignore:
      - "*"
  workflow_dispatch:

jobs:
  build:
    name: Build Sphinx docs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5.0.0

      - name: Set Python
        uses: actions/setup-python@v6.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r docs/requirements.txt

      - name: Build static files
        run: |
          cd docs
          make html-all
        env:
          DOCS_HOME_URL: https://dev.joinrpg.ru

      - name: Upload build artifact
        uses: actions/upload-artifact@v5.0.0
        with:
          name: docs-html
          path: docs/_build/html

  deploy:
    name: Deploy to docs.dev.joinrpg.ru S3
    needs: build
    # PR от dependabot не получают секреты репозитория, поэтому деплой
    # для них всегда падал бы. Сборка (job build) при этом проверяется.
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Download built HTML
        uses: actions/download-artifact@v6.0.0
        with:
          name: docs-html
          path: build_html

      - name: Set up S3cmd cli tool
        uses: s3-actions/s3cmd@v2.0.1
        with:
            provider: yandex
            region: ru-central1
            access_key: ${{ secrets.SYNC_ACCESS_ID }}
            secret_key: ${{ secrets.SYNC_ACCESS_SECRET }}

      - name: sync to s3
        run: |
          cd build_html
          s3cmd sync --recursive --exclude "*.css" --exclude "*.js" * s3://docs.dev.joinrpg.ru
          s3cmd sync --recursive --include "*.css" * --mime-type="text/css" s3://docs.dev.joinrpg.ru
          s3cmd sync --recursive --include "*.js" * --mime-type="application/javascript" s3://docs.dev.joinrpg.ru

  deploy-selectel:
    name: Deploy to docs.dev.joinrpg.ru Selectel S3
    needs: build
    # PR от dependabot не получают секреты репозитория (см. job deploy)
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Download built HTML
        uses: actions/download-artifact@v6.0.0
        with:
          name: docs-html
          path: build_html

      - name: Set up S3cmd cli tool
        run: |
          pip install s3cmd==2.4.0
          # В имени бакета есть точки: адрес вида <бакет>.s3.… не проходит проверку сертификата,
          # поэтому path-style: host_bucket без %(bucket)s, запросы идут на host_base
          cat > ~/.s3cfg <<CFG
          [default]
          access_key = $ACCESS_KEY
          secret_key = $SECRET_KEY
          host_base = s3.ru-6.storage.selcloud.ru
          host_bucket = docs.dev.joinrpg.ru
          bucket_location = ru-6
          use_https = True
          CFG
        env:
          ACCESS_KEY: ${{ secrets.SELECTEL_SYNC_ACCESS_ID }}
          SECRET_KEY: ${{ secrets.SELECTEL_SYNC_ACCESS_SECRET }}

      - name: sync to s3
        run: |
          cd build_html
          s3cmd sync --recursive --exclude "*.css" --exclude "*.js" * s3://docs.dev.joinrpg.ru
          s3cmd sync --recursive --include "*.css" * --mime-type="text/css" s3://docs.dev.joinrpg.ru
          s3cmd sync --recursive --include "*.js" * --mime-type="application/javascript" s3://docs.dev.joinrpg.ru
